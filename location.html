<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ارسال موقعیت — مبصر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "IRANSans", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .icon {
    font-size: 56px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 8px;
    font-weight: 700;
  }
  p.desc {
    font-size: 14px;
    line-height: 1.9;
    color: var(--tg-theme-hint-color, #707579);
    margin: 0 0 28px;
  }
  button.main-btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
    font-family: inherit;
  }
  button.main-btn:active { opacity: 0.85; }
  button.main-btn:disabled { opacity: 0.5; }
  .status {
    margin-top: 18px;
    font-size: 13px;
    line-height: 1.8;
    min-height: 20px;
  }
  .status.err { color: #e53935; }
  .status.ok { color: #2e9e44; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📍</div>
    <h1 id="title">ارسال موقعیت</h1>
    <p class="desc" id="desc">
      برای ثبت، دکمه‌ی زیر را بزنید. مرورگر از شما اجازه‌ی دسترسی به GPS می‌خواهد —
      این تنها راه ارسال موقعیت در این صفحه است؛ امکان انتخاب دستی از نقشه وجود ندارد.
    </p>
    <button class="main-btn" id="sendBtn">ارسال موقعیت واقعی من</button>
    <div class="status" id="status"></div>
  </div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const params = new URLSearchParams(window.location.search);
  const action = params.get('action') || 'check_in';
  const titleEl = document.getElementById('title');
  const btn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  if (action === 'check_out') {
    titleEl.textContent = 'ثبت خروج';
  } else {
    titleEl.textContent = 'ثبت ورود';
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function friendlyError(err) {
    switch (err.code) {
      case err.PERMISSION_DENIED:
        return 'اجازه‌ی دسترسی به موقعیت را ندادید. لطفاً دوباره تلاش کنید و این‌بار اجازه بدهید.';
      case err.POSITION_UNAVAILABLE:
        return 'موقعیت گوشی در دسترس نیست. مطمئن شوید GPS گوشی روشن است.';
      case err.TIMEOUT:
        return 'دریافت موقعیت طول کشید. دوباره تلاش کنید (بهتر است فضای باز باشید).';
      default:
        return 'خطایی در دریافت موقعیت رخ داد. دوباره تلاش کنید.';
    }
  }

  btn.addEventListener('click', function () {
    if (!navigator.geolocation) {
      setStatus('مرورگر شما از GPS پشتیبانی نمی‌کند.', 'err');
      return;
    }

    btn.disabled = true;
    setStatus('در حال دریافت موقعیت از GPS...');
    statusEl.innerHTML += '<span class="spinner"></span>';

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        const payload = JSON.stringify({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          action: action,
        });
        if (tg) {
          setStatus('موقعیت دریافت شد، در حال ارسال...', 'ok');
          tg.sendData(payload);
        } else {
          // برای تست مستقیم خارج از تلگرام (این حالت در تلگرام واقعی پیش نمی‌آید)
          setStatus('این صفحه باید از داخل تلگرام باز شود.', 'err');
          btn.disabled = false;
        }
      },
      function (err) {
        setStatus(friendlyError(err), 'err');
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
</script>
</body>
</html>
